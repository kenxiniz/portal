services:
  # Next.js application service
  node-app:
    build:
      context: ./node-app
      dockerfile: Dockerfile
      args:
        - APP_ENV=docker
    image: node-app
    container_name: node-app
    restart: always
    networks:
      - app-network
    extra_hosts:
      - "localhost:host-gateway"
    env_file:
      - ./node-app/.env
    depends_on:
      # 💡 몽고DB 의존성 삭제됨. Redis만 기다립니다.
      redis:
        condition: service_started

    # ==========================================================
    # 🔥 [보안 강화 구역] 해커의 RCE 및 채굴기 실행 원천 차단
    # ==========================================================
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 2G

    # ==========================================================
    volumes:
      - ./node-app/.next/cache:/app/.next/cache
      - ./node-app/.cache:/app/.cache
      - ./node-app/lib:/app/lib:ro
      - ./node-app/screenshots:/app/screenshots

  # 인메모리 캐시 서버 (Redis)
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - app-network
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 600M

  # Nginx reverse proxy service
  nginx:
    image: nginx:latest
    container_name: nginx_ssl
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/logs:/var/log/nginx
      - webroot:/var/www/html
    depends_on:
      - node-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    networks:
      - app-network

  # Certbot SSL certificate service
  certbot:
    build:
      context: ./certbot
      dockerfile: Dockerfile
    container_name: certbot_ssl
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certbot/logs:/var/log/certbot
      - webroot:/var/www/html
    restart: always
    networks:
      - app-network

# 💡 mongodb 서비스 및 mongodb_data 볼륨 삭제됨

networks:
  app-network:
    driver: bridge

volumes:
  webroot: