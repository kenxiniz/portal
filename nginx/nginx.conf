# nginx/nginx.conf

worker_processes auto;

# [추가] MongoDB를 위한 TCP 스트림 설정
stream {
  server {
    listen 27017;
    proxy_pass mongodb:27017;
    proxy_timeout 1h;
    proxy_connect_timeout 5s;
  }
}

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /var/log/nginx/access_log;
  error_log  /var/log/nginx/error.log;

  # Performance optimizations
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;

  # Gzip compression settings for faster page loads
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Production server for kenxin.org and www.kenxin.org
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kenxin.org www.kenxin.org;

    ssl_certificate /etc/letsencrypt/live/kenxin.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kenxin.org-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://node-app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Development server for dev.kenxin.org
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.kenxin.org;

    ssl_certificate /etc/letsencrypt/live/kenxin.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kenxin.org-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://host.docker.internal:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # VS Code server for code.kenxin.org
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name code.kenxin.org;

    ssl_certificate /etc/letsencrypt/live/kenxin.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kenxin.org-0001/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://host.docker.internal:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header Accept-Encoding gzip;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # Server block to handle all HTTP traffic
  # and redirect it to HTTPS
  server {
    listen 80;
    # Added code.kenxin.org to the 80 -> 443 redirect list
    server_name kenxin.org www.kenxin.org dev.kenxin.org code.kenxin.org;

    location /.well-known/acme-challenge/ {
      root /var/www/html;
      allow all;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 80 default_server;
    listen 443 ssl default_server;
    listen [::]:80 default_server;
    listen [::]:443 ssl default_server;

    # Dummy certificate for the SSL listener.
    ssl_certificate /etc/letsencrypt/live/kenxin.org-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kenxin.org-0001/privkey.pem;

    # Return 444 to close the connection without a response.
    return 444;
  }
}
